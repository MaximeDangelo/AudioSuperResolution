# Generated 2026-03-25 from:
# /home/maxime/Bureau/AudioSuperResolution/hparams/train_radio.yaml
# yamllint disable
# ############################################################
# Fine-tuning MetricGAN+ pour denoising radio ATC/militaire
# Adapte depuis recipes/Voicebank/enhance/MetricGAN/
# ############################################################

seed: 4234
__set_seed: !apply:speechbrain.utils.seed_everything [4234]

# Dossier du dataset genere par create_dataset.py
data_folder: /home/maxime/Bureau/AudioSuperResolution/dataset

MetricGAN_folder: ./results/MetricGAN_radio/4234/enhanced_wavs
output_folder: ./results/MetricGAN_radio/4234
save_folder: ./results/MetricGAN_radio/4234/save
train_log: ./results/MetricGAN_radio/4234/train_log.txt
enhanced_folder: ./results/MetricGAN_radio/4234/enhanced_wavs
historical_file: ./results/MetricGAN_radio/4234/historical.txt

# Tensorboard
use_tensorboard: true
tensorboard_logs: ./results/MetricGAN_radio/4234/logs/

# FFT parameters (16 kHz)
Sample_rate: 16000
Win_length: 32
Hop_length: 16
N_fft: 512
window_fn: &id005 !name:torch.hamming_window


# Data files
train_annotation: /home/maxime/Bureau/AudioSuperResolution/dataset/train.json
valid_annotation: /home/maxime/Bureau/AudioSuperResolution/dataset/valid.json
test_annotation: /home/maxime/Bureau/AudioSuperResolution/dataset/test.json
skip_prep: true  # On fait le prep nous-memes via prepare_data.py

# Metric cible
target_metric: pesq
n_jobs: 4  # Paralleliser l'eval PESQ

# --- Hyperparametres adaptes pour fine-tuning ---
# Dataset plus petit (3000 vs 10000+) : moins d'epoques, plus de samples/epoch
number_of_epochs: 200
number_of_samples: 300  # Plus de samples par epoch (etait 100)
min_mask: 0.05
train_N_batch: 1
valid_N_batch: 10
history_portion: 0.2

# Learning rates reduits pour fine-tuning (ne pas detruire les poids pre-entraines)
G_lr: 0.0001
D_lr: 0.0001
mse_weight: 0.5  # Ajouter un poids MSE pour stabiliser (etait 0)

dataloader_options:
  batch_size: 1
valid_dataloader_options:
  batch_size: 10

# Modele MetricGAN (meme architecture que le pretrained)
models:
# ################################
# Model: MetricGAN
# Authors: Szu-Wei Fu 2021
# ################################

# Neural parameters
  kernel_size: &id001 (5,5)
  base_channels: 15

  N_fft: 512

  generator: &id002 !new:speechbrain.lobes.models.MetricGAN.EnhancementGenerator

  discriminator: &id003 !new:speechbrain.lobes.models.MetricGAN.MetricDiscriminator

    kernel_size: *id001
    base_channels: 15
epoch_counter: &id004 !new:speechbrain.utils.epoch_loop.EpochCounter

  limit: 200

modules:
  generator: *id002
  discriminator: *id003
g_opt_class: !name:torch.optim.Adam
  lr: 0.0001
d_opt_class: !name:torch.optim.Adam
  lr: 0.0001

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
  checkpoints_dir: ./results/MetricGAN_radio/4234/save
  recoverables:
    generator: *id002
    discriminator: *id003
    counter: *id004
compute_cost: !name:speechbrain.nnet.losses.mse_loss

compute_si_snr: !name:speechbrain.nnet.loss.si_snr_loss.si_snr_loss

compute_STFT: &id006 !new:speechbrain.processing.features.STFT
  sample_rate: 16000
  win_length: 32
  hop_length: 16
  n_fft: 512
  window_fn: *id005
compute_ISTFT: &id007 !new:speechbrain.processing.features.ISTFT
  sample_rate: 16000
  win_length: 32
  hop_length: 16
  window_fn: *id005
resynth: !name:speechbrain.processing.signal_processing.resynthesize
  stft: *id006
  istft: *id007
  normalize_wavs: false

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
  save_file: ./results/MetricGAN_radio/4234/train_log.txt

tensorboard_train_logger: !new:speechbrain.utils.train_logger.TensorboardLogger
  save_dir: ./results/MetricGAN_radio/4234/logs/
