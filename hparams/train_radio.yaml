# ############################################################
# Fine-tuning MetricGAN+ pour denoising radio ATC/militaire
# Adapte depuis recipes/Voicebank/enhance/MetricGAN/
# ############################################################

seed: 4234
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]

# Dossier du dataset genere par create_dataset.py
data_folder: /home/maxime/Bureau/AudioSuperResolution/dataset

MetricGAN_folder: !ref <output_folder>/enhanced_wavs
output_folder: !ref ./results/MetricGAN_radio/<seed>
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt
enhanced_folder: !ref <output_folder>/enhanced_wavs
historical_file: !ref <output_folder>/historical.txt

# Tensorboard
use_tensorboard: True
tensorboard_logs: !ref <output_folder>/logs/

# FFT parameters (16 kHz)
Sample_rate: 16000
Win_length: 32
Hop_length: 16
N_fft: 512
window_fn: !name:torch.hamming_window

# Data files
train_annotation: !ref <data_folder>/train.json
valid_annotation: !ref <data_folder>/valid.json
test_annotation: !ref <data_folder>/test.json
skip_prep: True  # On fait le prep nous-memes via prepare_data.py

# Metric cible
target_metric: pesq
n_jobs: 4  # Paralleliser l'eval PESQ

# --- Hyperparametres adaptes pour fine-tuning ---
# Dataset plus petit (3000 vs 10000+) : moins d'epoques, plus de samples/epoch
number_of_epochs: 200
number_of_samples: 300  # Plus de samples par epoch (etait 100)
min_mask: 0.05
train_N_batch: 1
valid_N_batch: 10
history_portion: 0.2

# Learning rates reduits pour fine-tuning (ne pas detruire les poids pre-entraines)
G_lr: 0.0001
D_lr: 0.0001
mse_weight: 0.5  # Ajouter un poids MSE pour stabiliser (etait 0)

dataloader_options:
    batch_size: !ref <train_N_batch>
valid_dataloader_options:
    batch_size: !ref <valid_N_batch>

# Modele MetricGAN (meme architecture que le pretrained)
models: !include:models/MetricGAN.yaml
    N_fft: !ref <N_fft>

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

modules:
    generator: !ref <models[generator]>
    discriminator: !ref <models[discriminator]>

g_opt_class: !name:torch.optim.Adam
    lr: !ref <G_lr>
d_opt_class: !name:torch.optim.Adam
    lr: !ref <D_lr>

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        generator: !ref <models[generator]>
        discriminator: !ref <models[discriminator]>
        counter: !ref <epoch_counter>

compute_cost: !name:speechbrain.nnet.losses.mse_loss

compute_si_snr: !name:speechbrain.nnet.loss.si_snr_loss.si_snr_loss

compute_STFT: !new:speechbrain.processing.features.STFT
    sample_rate: !ref <Sample_rate>
    win_length: !ref <Win_length>
    hop_length: !ref <Hop_length>
    n_fft: !ref <N_fft>
    window_fn: !ref <window_fn>

compute_ISTFT: !new:speechbrain.processing.features.ISTFT
    sample_rate: !ref <Sample_rate>
    win_length: !ref <Win_length>
    hop_length: !ref <Hop_length>
    window_fn: !ref <window_fn>

resynth: !name:speechbrain.processing.signal_processing.resynthesize
    stft: !ref <compute_STFT>
    istft: !ref <compute_ISTFT>
    normalize_wavs: False

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

tensorboard_train_logger: !new:speechbrain.utils.train_logger.TensorboardLogger
    save_dir: !ref <tensorboard_logs>
